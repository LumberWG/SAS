<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SAS - A股智能分析系统，仅供学习研究，不构成投资建议" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0C10" />
    <title>SAS · A股智能分析系统</title>
    <!-- 首帧前恢复上次选的主题，避免先闪一下深色再切浅色（键名与 src/stores/theme.ts 一致） -->
    <script>
      try {
        var savedTheme = localStorage.getItem('sas-theme')
        if (savedTheme) document.documentElement.dataset.theme = savedTheme
      } catch (e) {
        /* localStorage 不可用（隐私模式）时用默认主题 */
      }
    </script>
    <!-- 字体：Inter（拉丁） + Noto Sans SC（中文） + JetBrains Mono（数字等宽） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
